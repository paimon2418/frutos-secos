<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1F1A14">
  <title>Share Your Feedback — Frutos Secos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #9D8368;
      --paper-light: #F1EAD9;
      --ink: #1F1A14;
      --ink-soft: #2E2419;
      --walnut: #4A3524;
      --line: rgba(31, 26, 20, 0.24);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .topbar {
      padding: 22px 28px;
      background: var(--ink);
      color: var(--paper-light);
      font-family: 'Fraunces', serif;
      font-size: 18px;
      letter-spacing: 0.06em;
      text-align: center;
    }

    main {
      width: min(100% - 32px, 600px);
      margin: 56px auto;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      color: var(--ink-soft);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 28px;
      height: 1px;
      background: currentColor;
      content: '';
    }

    h1, h2 { font-family: 'Fraunces', serif; font-weight: 400; }

    h1 {
      margin: 0;
      font-size: clamp(38px, 8vw, 58px);
      line-height: 1.05;
    }

    .intro {
      margin: 18px 0 28px;
      color: var(--ink-soft);
      font-size: 16px;
      font-weight: 300;
      line-height: 1.7;
    }

    .cafe-label {
      display: inline-block;
      margin-bottom: 24px;
      padding: 8px 11px;
      border: 1px solid var(--line);
      color: var(--ink-soft);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.04em;
    }

    .question-card {
      padding: 28px;
      background: var(--paper-light);
      box-shadow: 0 16px 36px rgba(31, 26, 20, 0.12);
    }

    .question-number {
      color: var(--walnut);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    fieldset { min-width: 0; margin: 12px 0 0; padding: 0; border: 0; }

    legend {
      margin-bottom: 20px;
      font-family: 'Fraunces', serif;
      font-size: 27px;
      line-height: 1.2;
    }

    .answer-list { display: grid; gap: 10px; }

    .field-label {
      margin-top: 4px;
      color: var(--ink-soft);
      font-size: 13px;
    }

    .field-input {
      width: 100%;
      min-height: 48px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 0;
      background: transparent;
      color: var(--ink);
      font: inherit;
    }

    .field-input:focus { outline: 2px solid var(--walnut); outline-offset: 2px; }

    .answer {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 54px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      cursor: pointer;
      font-size: 15px;
      transition: background 0.18s, border-color 0.18s;
    }

    .answer:hover { border-color: var(--walnut); background: rgba(157, 131, 104, 0.1); }
    .answer input { width: 18px; height: 18px; margin: 0; accent-color: var(--walnut); }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 16px 20px;
      border: 1px solid var(--ink);
      background: var(--ink);
      color: var(--paper-light);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }

    button:hover { background: transparent; color: var(--ink); }
    button:focus-visible, .answer:focus-within { outline: 2px solid var(--walnut); outline-offset: 3px; }

    .status { min-height: 1.5em; margin: 14px 0 0; color: var(--ink-soft); font-size: 13px; line-height: 1.5; }

    .review-link {
      display: block;
      margin-top: 12px;
      padding: 15px 20px;
      border: 1px solid var(--ink);
      color: var(--ink);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-align: center;
      text-decoration: none;
      text-transform: uppercase;
    }

    .review-link:hover { background: var(--ink); color: var(--paper-light); }

    @media (max-width: 480px) {
      main { margin: 36px auto; }
      .question-card { padding: 22px 18px; }
      .topbar { padding: 18px; }
    }
  </style>
</head>
<body>
  <header class="topbar">FRUTOS SECOS</header>
  <main>
    <div class="eyebrow">A moment to share</div>
    <h1>Your feedback<br>means a lot.</h1>
    <p class="intro">Tell us a little about what you enjoyed. It only takes a moment.</p>
    <div class="cafe-label" id="cafe-label">Café: loading…</div>

    <form id="feedback-form">
      <div id="questions-container" aria-live="polite"></div>
      <button type="submit" id="submit-button" disabled>Continue</button>
      <p class="status" id="form-status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script>
    const cafeId = new URLSearchParams(window.location.search).get('cafe');
    const cafeLabel = document.getElementById('cafe-label');
    const form = document.getElementById('feedback-form');
    const status = document.getElementById('form-status');
    const submitButton = document.getElementById('submit-button');
    const questionsContainer = document.getElementById('questions-container');
    let questions = [];

    function showQuestionLoadError(message) {
      status.textContent = message;
      submitButton.disabled = true;
    }

    async function loadQuestions() {
      if (!cafeId) {
        cafeLabel.textContent = 'Café link is missing an ID';
        showQuestionLoadError('Please scan the café QR code again.');
        return;
      }

      try {
        const response = await fetch(`/api/feedback?cafeId=${encodeURIComponent(cafeId)}`);
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Could not load the feedback questions.');

        cafeLabel.textContent = result.cafeName ? `Café: ${result.cafeName}` : `Café ID: ${cafeId}`;
        questions = result.questions || [];
        if (questions.length !== 3) throw new Error('This café’s feedback questions are not configured correctly.');

        questions.forEach((question, index) => {
          const section = document.createElement('section');
          section.className = 'question-card';
          section.style.marginTop = index ? '18px' : '0';

          const number = document.createElement('div');
          number.className = 'question-number';
          number.textContent = `Question 0${index + 1}`;
          section.appendChild(number);

          const fieldset = document.createElement('fieldset');
          const legend = document.createElement('legend');
          legend.textContent = question.prompt;
          fieldset.appendChild(legend);

          const answerList = document.createElement('div');
          answerList.className = 'answer-list';
          question.options.forEach((option) => {
            const label = document.createElement('label');
            label.className = 'answer';
            const input = document.createElement('input');
            input.type = 'radio';
            input.name = question.id;
            input.value = option;
            input.required = true;
            const span = document.createElement('span');
            span.textContent = option;
            label.append(input, span);
            answerList.appendChild(label);
          });

          fieldset.appendChild(answerList);
          section.appendChild(fieldset);
          questionsContainer.appendChild(section);
        });

        submitButton.disabled = false;
        status.textContent = '';
      } catch (error) {
        showQuestionLoadError(error.message || 'Could not load this café’s feedback questions.');
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!cafeId || questions.length !== 3) return;

      submitButton.disabled = true;
      status.textContent = 'Sending your feedback…';

      const answers = Object.fromEntries(new FormData(form).entries());
      try {
        const response = await fetch('/api/feedback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ cafeId, answers })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Your feedback could not be saved.');

        form.reset();
        const candidate = new URL(result.reviewUrl);
        const host = candidate.hostname.toLowerCase();
        const isGoogle = candidate.protocol === 'https:' &&
          (host === 'google.com' || host.endsWith('.google.com') || host === 'maps.app.goo.gl');

        if (!isGoogle) throw new Error('Feedback was saved, but this café’s Google Review link is invalid.');
        status.textContent = 'Thank you! Your feedback was saved. Opening Google Reviews…';
        window.location.assign(candidate.href);
      } catch (error) {
        status.textContent = error.message || 'We could not send your feedback. Please try again.';
        submitButton.disabled = false;
      }
    });

    loadQuestions();
  </script>
</body>
</html>
